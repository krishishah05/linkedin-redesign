<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Extra inline styles for icons & quick overrides */
    .nav-icon { width:24px; height:24px; display:block; }
    .li-post-modal__image-preview { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .li-post-modal__image-preview img { width:80px; height:80px; object-fit:cover; border-radius:4px; }
    .li-post-char-count { font-size:12px; color:var(--text-3); text-align:right; margin-top:4px; }
    .li-apply-progress { display:flex; gap:4px; margin-bottom:16px; }
    .li-apply-dot { height:4px; flex:1; border-radius:2px; background:var(--border); }
    .li-apply-dot.done { background:var(--blue); }
    .li-settings-form-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .li-settings-input { flex:1; min-width:200px; height:44px; border:1px solid var(--border-2); border-radius:4px; padding:0 12px; font-size:14px; outline:none; font-family:inherit; background:var(--white); color:var(--text); }
    .li-settings-input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(10,102,194,0.2); }
    .li-job-detail-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 24px; color:var(--text-2); text-align:center; }
    .li-job-detail-empty svg { margin-bottom:16px; opacity:0.3; }
    .li-group-tab { padding:14px 20px; font-size:14px; font-weight:600; color:var(--text-2); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; transition:color 0.15s; }
    .li-group-tab.active { color:var(--text); border-bottom-color:var(--text); }
  </style>
</head>
<body>

<!-- React mounts the entire app here -->
<div id="react-root"></div>

<!-- ═══════════════════════════════════════════════
     SCRIPTS
     Load order: CDN libs → plain JS → Babel components
═══════════════════════════════════════════════ -->

<!-- React 18 + ReactDOM 18 (UMD builds, no build step needed) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Babel standalone — transforms type="text/babel" scripts in-browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- SheetJS — Excel export for Recruiter Shortlist (pinned version for reliability) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- API utility (plain JS, no JSX) -->
<script src="js/api.js"></script>

<!-- Auth guard: redirect to login if no session token stored -->
<script>
  (function() {
    try {
      const token = localStorage.getItem('nx-token');
      if (!token) { window.location.href = 'index.html'; }
    } catch(_) {}
  })();

  // Cross-tab logout: if another tab removes nx-token, redirect here too
  window.addEventListener('storage', function(e) {
    if (e.key === 'nx-token' && !e.newValue) {
      window.location.href = 'index.html';
    }
  });
</script>

<!-- ── Shared utilities & context ──────────────────────────── -->
<script type="text/babel" src="js/components/utils.js?v=6"></script>
<script type="text/babel" src="js/components/AppContext.js?v=6"></script>

<!-- ── Shared UI components ────────────────────────────────── -->
<script type="text/babel" src="js/components/shared/Avatar.js?v=6"></script>
<script type="text/babel" src="js/components/shared/LoadingSpinner.js?v=6"></script>
<script type="text/babel" src="js/components/shared/ShortlistPanel.js?v=6"></script>
<script type="text/babel" src="js/components/ToastContainer.js?v=6"></script>

<!-- ── Page components ─────────────────────────────────────── -->
<script type="text/babel" src="js/components/pages/FeedPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/ProfilePage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/NetworkPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/JobsPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/MessagingPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/NotificationsPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/SearchPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/CompanyPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/GroupsPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/GroupDetailPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/EventsPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/LearningPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/SettingsPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/PremiumPage.js?v=6"></script>
<script type="text/babel" src="js/components/pages/ArticlePage.js?v=6"></script>

<!-- ── Modal components ────────────────────────────────────── -->
<script type="text/babel" src="js/components/modals/PostModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/ImageViewerModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/ConnectModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/ShareModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/ApplyModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/EditProfileModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/AddExpModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/AddEducationModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/AddSkillModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/CreateGroupModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/ReportModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/CreateEventModal.js?v=6"></script>
<script type="text/babel" src="js/components/modals/ModalContainer.js?v=6"></script>

<!-- ── Navigation components ───────────────────────────────── -->
<script type="text/babel" src="js/components/NavBar.js?v=6"></script>
<script type="text/babel" src="js/components/MobileNav.js?v=6"></script>

<!-- ── Root — mounts React app (must be last) ──────────────── -->
<script type="text/babel" src="js/components/App.js?v=6"></script>

</body>
</html>
