name: run-integration-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt requests

      - name: Run integration tests against deployed backend
        env:
          BASE_URL: https://linkedin-redesign-z364.onrender.com/api
          TEST_EMAIL: alex.johnson@gmail.com
          TEST_PASSWORD: password123
          SKIP_CLOUD_ONLY: "false"
        run: pytest backend/test_integration.py -v
