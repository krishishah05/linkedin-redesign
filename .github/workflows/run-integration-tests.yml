name: run-integration-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt requests

      - name: Start local backend
        run: |
          cd backend
          python app.py &
          echo "Waiting for local backend to be ready..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/jobs)
            if [ "$status" = "200" ]; then
              echo "Backend is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got $status, retrying in 2s..."
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Run integration tests against local backend
        env:
          BASE_URL: http://localhost:5000/api
          TEST_EMAIL: alex.johnson@gmail.com
          TEST_PASSWORD: password123
          SKIP_CLOUD_ONLY: "false"
        run: pytest backend/test_integration.py -v
